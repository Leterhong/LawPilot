# =============================================================
# LawPilot 生产叠加（Production Overlay）
# -------------------------------------------------------------
# 在通用基线（docker-compose.yml）之上叠加生产配置。
# 基线本身已不暴露 db / redis / backend / frontend 端口，仅 Nginx 暴露 80，
# 因此本文件无需、也无法用空序列去「删除」端口（Compose 会忽略空序列），
# 只需设置 production 环境、生产 CORS 与前端构建参数即可。
#
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# =============================================================
services:
  # -------------------------------
  # 后端：生产模式
  # -------------------------------
  backend:
    # 基线已仅保留 uploads 卷（无源码挂载），此处仅叠加环境变量。
    # ENVIRONMENT=production 关闭自动建表，依赖 Alembic 迁移；
    # 连接串等由 .env（env_file）注入，无需在此重复。
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    restart: unless-stopped

  # -------------------------------
  # 前端：生产构建参数（由 Nginx 统一代理 /api）
  # -------------------------------
  frontend:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost}
    restart: unless-stopped

  # -------------------------------
  # Nginx：生产网关（唯一对外入口）
  # -------------------------------
  nginx:
    ports:
      - "80:80"
      # 启用 HTTPS 时取消注释并挂载证书卷（见 README「HTTPS 部署」）
      # - "443:443"
    # volumes:
    #   - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    #   - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:

networks:
  lawpilot:
    driver: bridge
