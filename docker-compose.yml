# =============================================================
# LawPilot 通用编排（Base / 生产倾向基线）
# -------------------------------------------------------------
# 设计原则（三文件拆分，避免 Compose 无法删除父文件端口/卷的陷阱）：
#   - 本文件为「生产倾向」基线：db / redis / backend / frontend 均不向
#     宿主机暴露端口，仅 Nginx 暴露 80；后端不挂载源码（镜像内代码）。
#   - docker-compose.dev.yml  ：开发叠加，暴露端口 + 后端源码热重载。
#   - docker-compose.prod.yml ：生产叠加，设置 production 环境与构建参数。
#
# 用法：
#   开发： docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   生产： docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# =============================================================
services:
  # -------------------------------
  # PostgreSQL（含 pgvector 向量扩展）
  # -------------------------------
  db:
    image: pgvector/pgvector:pg17
    container_name: lawpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lawpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lawpilot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-lawpilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lawpilot} -d ${POSTGRES_DB:-lawpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lawpilot

  # -------------------------------
  # Redis（缓存 / 会话 / 队列）
  # -------------------------------
  redis:
    image: redis:7-alpine
    container_name: lawpilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lawpilot

  # -------------------------------
  # 后端 FastAPI（镜像内代码，不挂源码）
  # -------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lawpilot-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - lawpilot

  # -------------------------------
  # 前端 Next.js（镜像内构建产物）
  # -------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: lawpilot-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    networks:
      - lawpilot

  # -------------------------------
  # Nginx 网关（唯一对外入口）
  # -------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: lawpilot-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    networks:
      - lawpilot

volumes:
  pgdata:
  redisdata:
  uploads:

networks:
  lawpilot:
    driver: bridge
