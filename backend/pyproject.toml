[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lawpilot-backend"
version = "0.1.0"
description = "LawPilot 后端服务：法律问题解决平台 API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # 与 requirements.txt 保持一致：bcrypt 4.1+ 移除 __about__，与 passlib 1.7.4 不兼容
    # （注册/登录会 500）。此处必须与 requirements.txt 同为 <4.1。
    "bcrypt>=4.0.0,<4.1",
    "python-multipart>=0.0.12",
    "openai>=1.54.0",
    "pgvector>=0.3.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "Pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501（行超长）不纳入 CI 阻断：本仓库大量中文注释与长法条字符串无法自动折行，
# 交由 ruff format 统一处理可格式化的部分。其余规则保持全量开启。
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
