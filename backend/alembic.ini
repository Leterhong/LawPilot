# =============================================================
# Alembic configuration
# sqlalchemy.url is overridden at runtime in env.py (read from app.core.config),
# so this is only a placeholder to avoid hardcoding secrets.
# =============================================================
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Placeholder URL (env.py will override it)
sqlalchemy.url = postgresql+psycopg2://lawpilot:lawpilot_secret@localhost:5432/lawpilot

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
